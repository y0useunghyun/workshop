<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>거침과 부드러움</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- Adobe Fonts 웹 프로젝트 workshop (JJJGothic 500) — 크리에이티브 클라우드 구독 동안 유효, 못 불러오면 SUIT -->
<script>
  (function(d) {
    var config = {
      kitId: 'kfl5mqg',
      scriptTimeout: 3000,
      async: true
    },
    h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;h.className+=" wf-loading";tk.src='https://use.typekit.net/'+config.kitId+'.js';tk.async=true;tk.onload=tk.onreadystatechange=function(){a=this.readyState;if(f||a&&a!="complete"&&a!="loaded")return;f=true;clearTimeout(t);try{Typekit.load(config)}catch(e){}};s.parentNode.insertBefore(tk,s)
  })(document);
</script>
<style>
:root { --head: 40px; --hover: rgba(0, 0, 0, .88) }
html, body { margin: 0; height: 100%; background: #111; overflow: hidden }
/* 대체 글꼴 SUIT (SIL OFL 1.1) — fonts/OFL.txt */
@font-face { font-family: "SUIT"; src: url(fonts/SUIT-Regular.woff2) format("woff2"); font-weight: 400; font-display: swap }
@font-face { font-family: "SUIT"; src: url(fonts/SUIT-Medium.woff2) format("woff2"); font-weight: 500; font-display: swap }
@font-face { font-family: "SUIT"; src: url(fonts/SUIT-SemiBold.woff2) format("woff2"); font-weight: 600; font-display: swap }
body { font-family: "jjjgothic", "SUIT", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif }

header {
  position: fixed; top: 0; left: 0; right: 0; height: var(--head); z-index: 2;
  background: #000; color: #fff;
  display: flex; align-items: center; padding: 0 14px;
  font-size: 20px; font-weight: 500; letter-spacing: -.01em;
}

#stage { position: fixed; top: var(--head); left: 0; right: 0; bottom: 0; perspective: 900px }
#floor { position: absolute; inset: 0; transform-style: preserve-3d }

/* 바닥 — 모은 사진 */
.ph { position: absolute; background: #222 center / cover no-repeat; overflow: hidden }
.ph::after {
  content: attr(data-t); position: absolute; inset: 0; padding: 4px 5px;
  background: var(--hover); color: #fff; font-size: 11px; line-height: 1.3;
  opacity: 0;
}
@media (hover: hover) { .ph:hover::after { opacity: 1 } }

/* 한 층 위 — 사진으로 만든 작업 */
.box { position: absolute; transform-style: preserve-3d; display: block; color: #fff; text-decoration: none }
.box > * { position: absolute; background-repeat: no-repeat }
.box .face { inset: 0; background-size: cover; background-position: center }
.box .face span {
  position: absolute; inset: 0; padding: 8px 10px;
  background: var(--hover); font-size: 18px; line-height: 1.25;
  opacity: 0; transition: opacity .15s;
}
@media (hover: hover) { .box:hover .face span { opacity: 1 } }
.box:focus-visible .face span { opacity: 1 }

/* 벽 = 흰색 */
.wt, .wb, .wl, .wr { background: #fff }
.wt, .wb { left: 0; right: 0 }
.wl, .wr { top: 0; bottom: 0 }
.wt { top: 0; transform-origin: top; transform: rotateX(90deg) }
.wb { bottom: 0; transform-origin: bottom; transform: rotateX(-90deg) }
.wl { left: 0; transform-origin: left; transform: rotateY(-90deg) }
.wr { right: 0; transform-origin: right; transform: rotateY(90deg) }

/* 글 상자 — 오른쪽 끝, 위 한 줄 띄고 5줄. 밑에 깔린 사진이 아주 조금 비침 */
#note { position: absolute; background: rgba(255, 255, 255, .9); overflow: auto; container-type: size }
#note .in { padding: 2cqi 3.5cqi }
#note h1 { padding-right: 14cqi }   /* 번역 버튼 자리 */
#lang {
  position: absolute; top: 2.5cqi; right: 2.5cqi;
  background: #000; color: #fff; border: 0; border-radius: 0; cursor: pointer;
  font: inherit; font-size: clamp(10px, 3.6cqi, 14px); line-height: 1; padding: .45em .6em;
}
@media (hover: hover) { #lang:hover { background: #fff; color: #000; outline: 1px solid #000; outline-offset: -1px } }
#lang:focus-visible { outline: 2px solid #3d63f0; outline-offset: 2px }
#note h1 {
  margin: 0 0 .9em; font-size: 9.5cqi; font-weight: 500; line-height: 1.15; letter-spacing: -.02em; color: #000;
}
#note p {
  margin: 0;
  font-size: clamp(11px, 5.4cqi, 22px); font-weight: 500; line-height: 1.55; letter-spacing: -.01em; color: #000;
}
</style>
<link rel="stylesheet" href="back.css">
</head>
<body>
<header><span id="htitle">시각디자인 워크숍</span><button id="flip" type="button">인덱스</button></header>
<main id="stage"><div id="floor"></div></main>
<section id="back" hidden></section>

<script src="titles.js"></script>
<script src="index-data.js"></script>
<script src="back.js"></script>
<script>
// 바닥: 30일 동안 모은 자료 142장 (workshop1 items.js 순서)
const N = 142;
// 한 층 위: 그 사진들로 만든 작업
const WORKS = [
  { img: 'w/roll.jpg',  name: '롤',   en: 'Roll', sub: 'workshop 1', href: 'https://y0useunghyun.github.io/workshop1/' },
  { img: 'w/ring.jpg',  name: '띠', en: 'Band', sub: 'workshop 1', href: 'https://y0useunghyun.github.io/workshop1/#ring' },
  { img: 'w/weave.jpg', name: '직조', en: 'Weave', sub: 'workshop 2', href: 'https://y0useunghyun.github.io/workshop2/' },
  { img: 'w/cube.jpg',  name: '큐브',  en: 'Cube', sub: 'workshop 2', href: 'https://y0useunghyun.github.io/workshop2/cube.html' },
];
// 작업 칸 크기 (사진 칸 기준) — 폰은 칸 수를 줄이고, 칸을 세로로 살짝 길게 해서 5:4 비율 유지
const BIG_DESK = { w: 5, h: 4 }, BIG_PHONE = { w: 4, h: 3 };
const PHONE_MAX = 700;        // 이 폭보다 좁으면 폰
const WORK_RATIO = 5 / 4;     // 작업 칸 가로:세로
const NOTE_H = 5;             // 글 상자 최소 높이 (줄) — 글이 길면 늘어남
const NOTE_RATIO = 0.22;      // 글 상자 폭 (화면 폭 대비, 최소 4칸)
const NOTE_RATIO_PHONE = 0.6; // 폰은 글이 읽히게 넓게
const LIFT = 0.9;             // 작업이 올라온 높이 (사진 칸 한 변 대비)
const EDGE = 1;               // 작업은 화면 끝에서 이만큼 칸을 띄움 — 올라오며 커져도 안 잘리게
const ROUNDS = 300, TRIES = 60;

const stage = document.getElementById('stage');
const floor = document.getElementById('floor');

const pad = n => String(n).padStart(3, '0');
const el = (tag, cls, style) => Object.assign(document.createElement(tag), { className: cls, style });
// 사각형 a, b가 gap 칸 이내로 붙거나 겹치는지
const near = (a, b, gap) => a.c < b.c + b.w + gap && b.c < a.c + a.w + gap && a.r < b.r + b.h + gap && b.r < a.r + a.h + gap;

// 작업 4개를 화면 끝·글 상자·서로에게서 한 칸씩 띄워 무작위 배치.
// 자리가 모자라면(폰) 작업끼리는 붙여도 되게 다시 시도
function placeWorks(cols, rows, note, big) {
  const maxC = cols - big.w - EDGE, maxR = rows - big.h - EDGE;
  let best = [];
  for (const gap of [1, 0]) {
    for (let round = 0; round < ROUNDS && best.length < WORKS.length; round++) {
      const taken = [];
      for (let t = 0; t < TRIES && taken.length < WORKS.length; t++) {
        const p = { c: EDGE + Math.floor(Math.random() * (maxC - EDGE + 1)), r: EDGE + Math.floor(Math.random() * (maxR - EDGE + 1)), w: big.w, h: big.h };
        if (!near(p, note, 1) && !taken.some(q => near(p, q, gap))) taken.push(p);
      }
      if (taken.length > best.length) best = taken;
    }
    if (best.length === WORKS.length) break;
  }
  return best;
}

function layout() {
  const W = stage.clientWidth, H = stage.clientHeight;
  const big = W < PHONE_MAX ? BIG_PHONE : BIG_DESK;
  const cellRatio = (big.w / big.h) / WORK_RATIO;   // 사진 칸 세로/가로
  // 칸 세로/가로를 cellRatio에 맞춰 줄 수를 정하고, 사진이 다 안 들어가면 열을 늘림
  const fixed = WORKS.length * big.w * big.h;
  const noteWidth = cols => W < PHONE_MAX ? Math.round(cols * NOTE_RATIO_PHONE) : Math.max(4, Math.round(cols * NOTE_RATIO));
  let cols = Math.max(big.w + 2 * EDGE, Math.round(W / Math.sqrt(W * H / (N + fixed + 4 * NOTE_H) / cellRatio)));
  let rows;
  for (;;) {
    rows = Math.max(big.h + 2 * EDGE, NOTE_H + 1, Math.round(H / (W / cols * cellRatio)));
    if (cols * rows >= N + fixed) break;
    cols++;
  }
  const noteW = noteWidth(cols);
  const cw = W / cols, ch = H / rows;
  const lift = Math.min(cw, ch) * LIFT;

  // 글 상자: 글이 다 들어가도록 높이를 줄 단위로 늘림 (최소 NOTE_H줄)
  const noteEl = el('div', '', `width:${noteW * cw}px`);
  noteEl.id = 'note';
  floor.replaceChildren(noteEl);
  // 두 언어 중 긴 쪽에 맞춰 높이를 정해서, 바꿔도 넘치지 않게
  const textH = Object.keys(NOTE).map(lang => { noteEl.innerHTML = noteInner(lang); return noteEl.firstElementChild.offsetHeight; });
  const noteRows = Math.max(NOTE_H, Math.ceil(Math.max(...textH) / ch));
  fillNote(noteEl);
  const note = { c: cols - noteW, r: 1, w: noteW, h: noteRows };
  const spots = placeWorks(cols, rows, note, big);
  const used = new Set();
  for (const p of spots) for (let r = p.r; r < p.r + p.h; r++) for (let c = p.c; c < p.c + p.w; c++) used.add(r * cols + c);

  const frag = document.createDocumentFragment();
  let i = 0;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    if (used.has(r * cols + c)) continue;
    const k = i++ % N;
    const ph = el('div', 'ph', `left:${c * cw}px;top:${r * ch}px;width:${Math.ceil(cw)}px;height:${Math.ceil(ch)}px;background-image:url(t/${pad(k + 1)}.jpg)`);
    if (TITLES[k]) ph.dataset.t = TITLES[k];
    frag.appendChild(ph);
  }

  spots.forEach((p, j) => {
    const w = WORKS[j];
    const box = el('a', 'box', `left:${p.c * cw}px;top:${p.r * ch}px;width:${big.w * cw}px;height:${big.h * ch}px;--img:url(${w.img})`);
    box.href = w.href;
    box.setAttribute('aria-label', `${w.name} — ${w.sub}`);
    for (const s of ['wt', 'wb']) box.appendChild(el('div', s, `height:${lift}px`));
    for (const s of ['wl', 'wr']) box.appendChild(el('div', s, `width:${lift}px`));
    const face = el('div', 'face', `background-image:url(${w.img});transform:translateZ(${lift}px)`);
    face.appendChild(Object.assign(document.createElement('span'), { innerHTML: `${w.name}<br>${w.sub}` }));
    box.appendChild(face);
    frag.appendChild(box);
  });

  Object.assign(noteEl.style, { left: `${note.c * cw}px`, top: `${note.r * ch}px`, height: `${note.h * ch}px` });
  frag.appendChild(noteEl);

  floor.replaceChildren(frag);
}

// 글 상자 내용 — 여기에 글 넣기 (한국어 / 영어)
const NOTE = {
  ko: {
    header: '시각디자인 워크숍',
    title: '30일 프로젝트 1',
    body: '안녕하세요. 저희는 계원예술대학교 시각디자인 워크숍 수업에서 ‘30일 프로젝트’를 진행했습니다. 30일 동안 팀원 5명이 거침과 부드러움을 주제로, 매체에 상관없이 자료를 수집했습니다. 그리고 수집한 자료를 보여주는 방식에 대해 고민하고, 시도해 보았습니다.',
    button: 'EN', label: '영어로 보기', toBack: '인덱스', toFront: '닫기',
  },
  en: {
    header: 'Visual Design Workshop',
    title: '30-Day Project 1',
    body: 'Hello. In the Visual Design Workshop class at Kaywon University of Art & Design, we carried out the ‘30-Day Project.’ For 30 days, our five team members collected materials on the themes of roughness and softness, regardless of medium. We then explored and experimented with ways of presenting what we collected.',
    button: 'KO', label: '한국어로 보기', toBack: 'Index', toFront: 'Close',
  },
};
let noteLang = 'ko';
const noteInner = lang => `<div class="in" lang="${lang}"><h1>${NOTE[lang].title}</h1><p>${NOTE[lang].body}</p></div>`;

function fillNote(noteEl) {
  const t = NOTE[noteLang];
  // 헤더·뒷면도 같은 언어로
  document.getElementById('htitle').textContent = t.header;
  document.documentElement.lang = noteLang;
  setFlipLabel();
  renderBack(noteLang, WORKS.map(w => ({ ...w, name: noteLang === 'en' ? w.en : w.name })));
  noteEl.innerHTML = noteInner(noteLang) + `<button id="lang" type="button" aria-label="${t.label}">${t.button}</button>`;
  noteEl.querySelector('#lang').addEventListener('click', () => {
    noteLang = noteLang === 'ko' ? 'en' : 'ko';
    fillNote(noteEl);
    noteEl.querySelector('#lang').focus();
  });
}

// 앞면 ↔ 뒷면 — 주소 #index 가 뒷면 (뒤로 가기로 돌아옴)
const back = document.getElementById('back');
const flipBtn = document.getElementById('flip');
const onBack = () => location.hash === '#index';
let staleLayout = false;   // 뒷면일 때 창 크기가 바뀌면 앞면 돌아올 때 다시 배치
function setFlipLabel() { flipBtn.textContent = onBack() ? NOTE[noteLang].toFront : NOTE[noteLang].toBack; }
function showSide(animate) {
  const toBack = onBack();
  if (toBack === stage.hidden) return;
  setFlipLabel();
  flipTo(toBack ? stage : back, toBack ? back : stage, animate).then(() => {
    if (!toBack && staleLayout) { staleLayout = false; layout(); }
  });
}
flipBtn.addEventListener('click', () => {
  history.pushState(null, '', onBack() ? location.pathname + location.search : '#index');
  showSide(true);
});
addEventListener('popstate', () => showSide(true));

layout();
showSide(false);
let timer;
addEventListener('resize', () => {
  clearTimeout(timer);
  timer = setTimeout(() => { if (stage.hidden) staleLayout = true; else layout(); }, 150);
});
</script>
</body>
</html>
